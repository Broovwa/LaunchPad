<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Launchpad — Cast Receiver</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap');

  :root{
    --bg-deep:#241c47;
    --bg-glow:#382b63;
    --surface:#392e64;
    --surface-hi:#473a78;
    --hairline:#524384;
    --text-hi:#fdf7ec;
    --text-mid:#c6bce8;
    --text-dim:#8c81b3;
    --sun:#ffb238;
    --sun-soft:#ffd98c;
    --calm:#4fd1b3;
    --warn:#ffb238;
    --crit:#ff6f6f;
    --kid-c0:#6fb1f2;
    --kid-c1:#f2946f;
    --kid-c2:#c9a0f2;
    --kid-c3:#7fd8d1;
    --kid-c4:#f2d16b;
    --kid-c5:#e29ad0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(60% 50% at 82% -6%, #4a3a80 0%, transparent 60%),
      radial-gradient(45% 40% at 8% 108%, #2f2758 0%, transparent 55%),
      var(--bg-deep);
    color:var(--text-hi);
    font-family:'Quicksand', 'Segoe UI', sans-serif;
    height:100vh;
    overflow:hidden;
  }

  .stage{
    max-width:1500px;
    margin:0 auto;
    padding:1.6vh 2.4vw 1.8vh;
    display:flex;
    flex-direction:column;
    gap:1.3vh;
    height:100vh;
    box-sizing:border-box;
  }

  /* ---- top bar ---- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:1.6rem;
  }
  .date-line{
    margin:0;
    color:var(--text-hi);
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(1.8rem, 3.6vw, 2.8rem);
    text-wrap:balance;
  }

  .wod-word{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(0.95rem, 1.2vw, 1.1rem);
    color:var(--sun-soft);
  }
  .wod-def{
    font-size:clamp(0.8rem, 1vw, 0.9rem);
    color:var(--text-mid);
  }

  .topbar-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:0.4rem;
    flex:0 0 auto;
  }
  .time-pair{
    display:flex;
    gap:clamp(2.2rem, 5.5vw, 4.2rem);
    flex:0 0 auto;
  }
  .time-block{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:0.15rem;
  }
  .time-label{
    font-size:clamp(0.68rem, 0.85vw, 0.8rem);
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:700;
  }
  .time-value{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(2.1rem, 4.6vw, 3.4rem);
    line-height:1;
    font-variant-numeric:tabular-nums;
    text-align:right;
    white-space:nowrap;
  }
  .time-value small{
    font-size:0.36em;
    color:var(--text-mid);
    margin-left:0.25rem;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
  }

  /* ---- middle row: fun fact | countdown dial | (reserved for activities) ---- */
  .mid-row{
    display:flex;
    align-items:stretch;
    gap:clamp(0.6rem, 1.2vw, 1rem);
    flex:0 0 auto;
  }

  .side-card{
    flex:1 1 0;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:20px;
    padding:clamp(0.7rem, 1.3vw, 1.1rem);
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:0.3rem;
    min-width:0;
  }
  .side-card-eyebrow{
    font-size:clamp(0.62rem, 0.78vw, 0.72rem);
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:700;
  }
  .side-card-body{
    font-size:clamp(0.82rem, 1.05vw, 0.98rem);
    color:var(--text-mid);
    line-height:1.35;
  }
  .side-card-body strong{
    color:var(--sun-soft);
    font-family:'Fredoka', sans-serif;
    font-weight:600;
  }
  .side-card-section{
    display:flex;
    flex-direction:column;
    gap:0.3rem;
  }
  .side-card-divider{
    height:1px;
    background:var(--hairline);
    margin:0.5rem 0;
    flex:0 0 auto;
  }

  .activity-row{
    display:flex;
    gap:0.5rem;
    align-items:baseline;
  }
  .activity-time{
    font-weight:700;
    color:var(--sun-soft);
    font-variant-numeric:tabular-nums;
    flex:0 0 auto;
    font-size:0.9em;
  }
  .activity-title{
    color:var(--text-mid);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .countdown{
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:24px;
    padding:clamp(0.6rem, 1.2vw, 1rem);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:border-color 0.4s ease;
    flex:0 0 auto;
  }
  .countdown.state-warn{border-color:color-mix(in srgb, var(--warn) 55%, var(--hairline));}
  .countdown.state-crit{border-color:color-mix(in srgb, var(--crit) 65%, var(--hairline)); animation:pulseBorder 1.6s ease-in-out infinite;}
  @keyframes pulseBorder{
    0%,100%{box-shadow:0 0 0 rgba(255,111,111,0);}
    50%{box-shadow:0 0 0 8px rgba(255,111,111,0.08);}
  }

  .dial-wrap{
    position:relative;
    width:clamp(170px, 19vw, 235px);
    height:clamp(170px, 19vw, 235px);
    flex:0 0 auto;
  }
  .dial-face{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }
  .dial-ring{
    fill:var(--bg-deep);
    stroke:var(--hairline);
    stroke-width:3;
  }
  .dial-tick{
    stroke:var(--hairline);
    stroke-width:2.5;
    stroke-linecap:round;
  }
  .dial-wedge{
    fill:var(--sun);
    transition:fill 0.4s ease;
  }
  .countdown.state-warn .dial-wedge{fill:var(--warn);}
  .countdown.state-crit .dial-wedge{fill:var(--crit);}
  .dial-hub{fill:var(--text-hi);}

  .dial-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0.2rem;
    pointer-events:none;
    text-align:center;
  }
  .dial-time{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(1.9rem, 3.8vw, 2.9rem);
    font-variant-numeric:tabular-nums;
    color:var(--text-hi);
    line-height:1;
  }
  .track-caption{
    font-size:clamp(0.68rem, 0.85vw, 0.8rem);
    color:var(--text-mid);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    max-width:70%;
  }

  /* ---- tasks ---- */
  .tasks-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:1rem;
    flex:0 0 auto;
  }
  .tasks-title{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(1rem, 1.5vw, 1.3rem);
    margin:0;
  }
  .tasks-progress-chip{
    background:var(--surface-hi);
    border-radius:999px;
    padding:0.3rem 0.8rem;
    font-weight:700;
    font-size:clamp(0.75rem, 0.95vw, 0.88rem);
    color:var(--sun-soft);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .kids-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:clamp(0.6rem, 1.1vw, 1rem);
    flex:1 1 auto;
    min-height:0;
  }

  .kid-card{
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:18px;
    padding:clamp(0.6rem, 1vw, 0.9rem);
    display:flex;
    flex-direction:column;
    gap:clamp(0.3rem, 0.55vw, 0.5rem);
  }

  .kid-header{
    display:flex;
    align-items:center;
    gap:0.55rem;
    border-bottom:1px solid var(--hairline);
    padding-bottom:clamp(0.35rem, 0.6vw, 0.55rem);
  }
  .kid-avatar{
    width:clamp(28px, 3vw, 36px);
    height:clamp(28px, 3vw, 36px);
    border-radius:50%;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(0.85rem, 1.05vw, 1rem);
    color:var(--bg-deep);
  }
  .kid-name{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:clamp(0.92rem, 1.15vw, 1.08rem);
    flex:1 1 auto;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  /* colored badges, not emoji — Chromecast's built-in browser often lacks
     color-emoji glyphs, so medal emoji can silently render as nothing on a TV
     even though they look fine in a normal desktop browser */
  .kid-medal{
    width:clamp(18px, 1.9vw, 22px);
    height:clamp(18px, 1.9vw, 22px);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:clamp(0.65rem, 0.8vw, 0.78rem);
    color:var(--bg-deep);
    flex:0 0 auto;
  }
  .kid-medal:empty{display:none;}
  .kid-medal.rank-0{background:#ffd24d;}
  .kid-medal.rank-1{background:#ccd4de;}
  .kid-medal.rank-2{background:#dd9a63;}
  .kid-progress{
    font-weight:700;
    font-size:clamp(0.68rem, 0.85vw, 0.78rem);
    color:var(--text-dim);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    flex:0 0 auto;
  }
  .kid-progress.all-done{color:var(--calm);}

  .kid-tasklist{
    display:flex;
    flex-direction:column;
    gap:clamp(0.1rem, 0.25vw, 0.2rem);
  }
  .kid-tasklist.two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(0.1rem, 0.25vw, 0.2rem) clamp(0.4rem, 0.8vw, 0.6rem);
  }

  .task-row{
    display:flex;
    align-items:center;
    gap:0.55rem;
    padding:clamp(0.25rem, 0.5vw, 0.38rem) clamp(0.35rem, 0.6vw, 0.5rem);
    border-radius:10px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    transition:background 0.25s ease;
  }
  .task-row:hover{background:var(--surface-hi);}
  .task-row:active{transform:scale(0.99);}
  .task-row:focus-visible{outline:3px solid var(--sun); outline-offset:2px;}

  .task-checkbox{
    width:clamp(18px, 1.9vw, 22px);
    height:clamp(18px, 1.9vw, 22px);
    border-radius:6px;
    border:2px solid var(--hairline);
    background:var(--bg-deep);
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 0.25s ease, border-color 0.25s ease;
  }
  .task-checkbox svg{
    width:65%;
    height:65%;
    stroke:var(--bg-deep);
    stroke-width:3;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:0;
    transition:opacity 0.15s ease;
  }

  .kid-empty{
    color:var(--text-dim);
    font-size:0.82rem;
    padding:0.3rem 0.2rem;
  }

  .task-label{
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:clamp(0.8rem, 1vw, 0.92rem);
    transition:color 0.3s ease, opacity 0.3s ease;
    flex:1 1 auto;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .task-row.done .task-checkbox{background:var(--calm); border-color:var(--calm);}
  .task-row.done .task-checkbox svg{opacity:1;}
  .task-row.done .task-label{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--calm); text-decoration-thickness:2px; opacity:0.75;}

  .task-row.bounce{animation:bounce 0.38s ease;}
  @keyframes bounce{
    0%{transform:scale(1);}
    35%{transform:scale(1.025);}
    100%{transform:scale(1);}
  }

  /* ---- footer banner ---- */
  .banner{
    text-align:center;
    font-family:'Fredoka', sans-serif;
    font-weight:500;
    font-size:clamp(0.85rem, 1.3vw, 1.1rem);
    padding:0.55rem 1rem;
    border-radius:14px;
    background:var(--surface-hi);
    color:var(--sun-soft);
    transition:background 0.4s ease, color 0.4s ease;
    flex:0 0 auto;
  }
  .banner.ready{background:color-mix(in srgb, var(--calm) 22%, var(--surface-hi)); color:var(--calm);}
  .banner.crit{background:color-mix(in srgb, var(--crit) 20%, var(--surface-hi)); color:#ffb3b3;}

  .conn-pill{
    align-self:flex-end;
    font-size:0.68rem;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--surface-hi);
    border-radius:999px;
    padding:0.2rem 0.6rem;
  }

  @media (max-width: 640px){
    .topbar{flex-direction:column; align-items:flex-start;}
    .time-pair{align-self:flex-start;}
    .time-block{align-items:flex-start;}
    .time-value{text-align:left;}
  }

  @media (prefers-reduced-motion: reduce){
    .countdown.state-crit{animation:none;}
    .task-row.bounce{animation:none;}
    .task-row{transition:none;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="topbar">
    <p class="date-line" id="dateLine">&nbsp;</p>
    <div class="topbar-right">
      <span class="conn-pill" id="connPill">Waiting for phone…</span>
      <div class="time-pair">
        <div class="time-block">
          <span class="time-label">Current time</span>
          <div class="time-value" id="clock">--:-- <small>--</small></div>
        </div>
        <div class="time-block">
          <span class="time-label">Leave time</span>
          <div class="time-value" id="leaveClock">--:-- <small>--</small></div>
        </div>
      </div>
    </div>
  </div>

  <div class="mid-row">
    <div class="side-card">
      <div class="side-card-section">
        <span class="side-card-eyebrow">Word of the day</span>
        <p class="side-card-body"><span class="wod-word" id="wodWord">—</span> <span id="wodDef"></span></p>
      </div>
      <div class="side-card-divider"></div>
      <div class="side-card-section">
        <span class="side-card-eyebrow">Fun fact</span>
        <p class="side-card-body" id="funFactBody">—</p>
      </div>
    </div>

    <div class="countdown" id="countdownBand">
      <div class="dial-wrap">
        <svg class="dial-face" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="dial-ring" cx="100" cy="100" r="92"></circle>
          <g class="dial-ticks" id="dialTicks"></g>
          <path class="dial-wedge" id="dialWedge" d=""></path>
          <circle class="dial-hub" cx="100" cy="100" r="4"></circle>
        </svg>
        <div class="dial-center">
          <div class="dial-time" id="countdownTime">--:--</div>
          <span class="track-caption" id="trackCaption">until the bus</span>
        </div>
      </div>
    </div>

    <div class="side-card">
      <div class="side-card-section">
        <span class="side-card-eyebrow">This afternoon</span>
        <div class="side-card-body" id="activitiesBody">Nothing on the calendar today.</div>
      </div>
      <div class="side-card-divider"></div>
      <div class="side-card-section">
        <span class="side-card-eyebrow">What's for dinner?</span>
        <p class="side-card-body" id="dinnerBody">Not planned yet.</p>
      </div>
    </div>
  </div>

  <div class="tasks-header">
    <h2 class="tasks-title">Get-ready checklist</h2>
    <span class="tasks-progress-chip" id="progressChip">0 of 15 done</span>
  </div>

  <div class="kids-grid" id="kidsGrid"></div>

  <div class="banner" id="banner">Waiting for the Morning Launchpad app to connect…</div>
</div>

<script>
(function(){
  var CHECK_ICON = '<svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>';
  var KID_COLOR_PALETTE = ['var(--kid-c0)','var(--kid-c1)','var(--kid-c2)','var(--kid-c3)','var(--kid-c4)','var(--kid-c5)'];

  // shown before any phone has ever connected; the phone's App Setup is the real
  // source of truth once it syncs — see applyStateSync()
  function defaultKids(){
    function tasks(){
      return [
        { id:'teeth', label:'Brush teeth', done:false },
        { id:'dressed', label:'Get dressed', done:false },
        { id:'breakfast', label:'Eat breakfast', done:false },
        { id:'backpack', label:'Pack backpack', done:false },
        { id:'shoes', label:'Put on shoes', done:false }
      ];
    }
    return [
      { id:'bronson', name:'Bronson', colorIndex:0, tasks: tasks() },
      { id:'bruce', name:'Bruce', colorIndex:1, tasks: tasks() },
      { id:'cheryl', name:'Cheryl', colorIndex:2, tasks: tasks() }
    ];
  }

  var currentKids = [];
  var kidsGrid = document.getElementById('kidsGrid');
  var rowRefs = {};
  var progressRefs = {};
  var medalRefs = {};
  var finishOrder = []; // kidIds in the order they first completed every task — drives medals

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // full rebuild of the kids grid — called on first load and whenever the phone
  // sends a new STATE_SYNC (a kid or task was added/removed/renamed)
  function renderDashboard(kidsConfig){
    currentKids = kidsConfig;
    kidsGrid.innerHTML = '';
    rowRefs = {};
    progressRefs = {};
    medalRefs = {};
    // finishOrder is intentionally NOT reset here — it must survive a resync
    // (a kid or task added/renamed, leave time changed) so a medal already
    // earned this morning doesn't get shuffled or lost. updateMedals() below
    // prunes any kid id that no longer exists or is no longer fully done.

    kidsConfig.forEach(function(kid){
      rowRefs[kid.id] = {};
      var color = KID_COLOR_PALETTE[kid.colorIndex % KID_COLOR_PALETTE.length];

      var card = document.createElement('div');
      card.className = 'kid-card';

      var header = document.createElement('div');
      header.className = 'kid-header';
      header.innerHTML =
        '<div class="kid-avatar" style="background:' + color + '">' + escapeHtml((kid.name || '?').charAt(0)) + '</div>' +
        '<div class="kid-name">' + escapeHtml(kid.name) + '</div>' +
        '<span class="kid-medal"></span>';
      var progressEl = document.createElement('div');
      progressEl.className = 'kid-progress';
      header.appendChild(progressEl);
      card.appendChild(header);
      progressRefs[kid.id] = progressEl;
      medalRefs[kid.id] = header.querySelector('.kid-medal');

      var list = document.createElement('div');
      list.className = 'kid-tasklist' + ((kid.tasks && kid.tasks.length > 5) ? ' two-col' : '');

      if(!kid.tasks || kid.tasks.length === 0){
        var empty = document.createElement('div');
        empty.className = 'kid-empty';
        empty.textContent = 'No tasks yet';
        list.appendChild(empty);
      }

      (kid.tasks || []).forEach(function(t){
        var row = document.createElement('div');
        row.className = 'task-row' + (t.done ? ' done' : '');
        row.tabIndex = 0;
        row.setAttribute('role','checkbox');
        row.setAttribute('aria-checked', t.done ? 'true' : 'false');
        row.innerHTML =
          '<div class="task-checkbox">' + CHECK_ICON + '</div>' +
          '<div class="task-label">' + escapeHtml(t.label) + '</div>';
        function toggle(){ applyToggle(kid.id, t.id, true); }
        row.addEventListener('click', toggle);
        row.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });
        rowRefs[kid.id][t.id] = row;
        list.appendChild(row);
      });

      card.appendChild(list);
      kidsGrid.appendChild(card);
      updateKidProgress(kid.id);
    });

    updateProgress();
  }

  function findTask(kidId, taskId){
    var kid = currentKids.filter(function(k){ return k.id === kidId; })[0];
    if(!kid) return null;
    return (kid.tasks || []).filter(function(t){ return t.id === taskId; })[0] || null;
  }

  // applies a single task toggle to local state + DOM; broadcasts to phone(s) when it
  // originated on the TV itself (a click here), not when it's an echo of a phone message
  function applyToggle(kidId, taskId, broadcast){
    var task = findTask(kidId, taskId);
    if(!task) return;
    task.done = !task.done;
    var row = rowRefs[kidId] && rowRefs[kidId][taskId];
    if(row){
      row.classList.toggle('done', task.done);
      row.setAttribute('aria-checked', task.done ? 'true' : 'false');
      row.classList.remove('bounce'); void row.offsetWidth; row.classList.add('bounce');
    }
    updateKidProgress(kidId);
    updateProgress();
    if(broadcast && typeof window.__launchpadSendToggle === 'function'){
      window.__launchpadSendToggle(kidId, taskId);
    }
  }

  var activitiesBody = document.getElementById('activitiesBody');
  function renderActivities(items){
    if(!items || items.length === 0){
      activitiesBody.textContent = 'Nothing on the calendar this afternoon.';
      return;
    }
    activitiesBody.innerHTML = items.map(function(item){
      return '<div class="activity-row"><span class="activity-time">' + escapeHtml(item.time) +
        '</span><span class="activity-title">' + escapeHtml(item.title) + '</span></div>';
    }).join('');
  }

  var dinnerBody = document.getElementById('dinnerBody');
  function renderDinner(meal){
    dinnerBody.textContent = (meal && meal.trim().length > 0) ? meal : 'Not planned yet.';
  }

  // replaces leave time and/or the whole kids/tasks structure — sent by the phone
  // right after it connects, and again whenever App Setup or the calendar changes
  function applyStateSync(data){
    if(typeof data.leaveTime === 'number'){
      setLeaveTime(new Date(data.leaveTime), new Date(), typeof data.totalMs === 'number' ? data.totalMs : null);
    }
    if(Array.isArray(data.kids)){
      renderDashboard(data.kids);
    }
    if(Array.isArray(data.activities)){
      renderActivities(data.activities);
    }
    if(typeof data.dinnerToday === 'string'){
      renderDinner(data.dinnerToday);
    }
    tick();
  }
  window.__launchpadApplyToggle = applyToggle;
  window.__launchpadApplyStateSync = applyStateSync;

  function updateKidProgress(kidId){
    var kid = currentKids.filter(function(k){ return k.id === kidId; })[0];
    var progressEl = progressRefs[kidId];
    if(!kid || !progressEl) return;
    var tasks = kid.tasks || [];
    var count = tasks.filter(function(t){ return t.done; }).length;
    progressEl.textContent = count + '/' + tasks.length;
    progressEl.classList.toggle('all-done', tasks.length > 0 && count === tasks.length);
  }

  // first kid to finish every task gets gold, second gets silver, third bronze —
  // a kid drops off the podium if a task gets unchecked again
  function updateMedals(){
    finishOrder = finishOrder.filter(function(kidId){
      var kid = currentKids.filter(function(k){ return k.id === kidId; })[0];
      return !!(kid && kid.tasks && kid.tasks.length > 0 && kid.tasks.every(function(t){ return t.done; }));
    });
    currentKids.forEach(function(kid){
      var allDone = kid.tasks && kid.tasks.length > 0 && kid.tasks.every(function(t){ return t.done; });
      if(allDone && finishOrder.indexOf(kid.id) === -1){
        finishOrder.push(kid.id);
      }
    });
    currentKids.forEach(function(kid){
      var medalEl = medalRefs[kid.id];
      if(!medalEl) return;
      var rank = finishOrder.indexOf(kid.id);
      medalEl.className = 'kid-medal';
      if(rank >= 0 && rank < 3){
        medalEl.classList.add('rank-' + rank);
        medalEl.textContent = String(rank + 1);
      } else {
        medalEl.textContent = '';
      }
    });
  }

  var progressChip = document.getElementById('progressChip');
  var banner = document.getElementById('banner');
  function totalDoneCount(){
    var doneCount = 0, total = 0;
    currentKids.forEach(function(kid){
      (kid.tasks || []).forEach(function(t){ total++; if(t.done) doneCount++; });
    });
    return { done: doneCount, total: total };
  }
  function updateProgress(){
    updateMedals();
    var counts = totalDoneCount();
    progressChip.textContent = counts.done + ' of ' + counts.total + ' done';
    if(counts.total > 0 && counts.done === counts.total){
      banner.textContent = "Everyone's ready — nice work! ✨";
      banner.className = 'banner ready';
    } else {
      banner.className = 'banner';
      var remaining = counts.total - counts.done;
      banner.textContent = remaining + ' task' + (remaining === 1 ? '' : 's') + ' left to check off';
    }
  }

  renderDashboard(defaultKids());

  // ---- clock ----
  var clockEl = document.getElementById('clock');
  var leaveClockEl = document.getElementById('leaveClock');
  var dateLine = document.getElementById('dateLine');
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function formatClock(d){
    var h = d.getHours();
    var m = d.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    return h12 + ':' + pad(m) + ' <small>' + ampm + '</small>';
  }

  function renderClock(now){
    clockEl.innerHTML = formatClock(now);
    dateLine.textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
  }

  // ---- word of the day ----
  var WORD_LIST = [
    { word:'Luminous', def:'full of light; glowing brightly' },
    { word:'Curious', def:'eager to learn or find out more' },
    { word:'Fortitude', def:'courage in facing pain or hardship' },
    { word:'Whimsical', def:'playfully quirky or fanciful' },
    { word:'Diligent', def:'showing care and effort in your work' },
    { word:'Serene', def:'calm, peaceful, and untroubled' },
    { word:'Vivid', def:'producing bright, clear images' },
    { word:'Resilient', def:'able to bounce back from difficulty' },
    { word:'Peculiar', def:'strange or unusual' },
    { word:'Radiant', def:'shining brightly; glowing with joy' },
    { word:'Bashful', def:'shy or easily embarrassed' },
    { word:'Nimble', def:'quick and light in movement' },
    { word:'Jubilant', def:'feeling great happiness and triumph' },
    { word:'Meticulous', def:'very careful and precise' },
    { word:'Mysterious', def:'difficult to understand or explain' },
    { word:'Gigantic', def:'extremely large; huge' },
    { word:'Marvelous', def:'causing great wonder; excellent' },
    { word:'Ambitious', def:'having a strong desire to succeed' },
    { word:'Cheerful', def:'noticeably happy and positive' },
    { word:'Brilliant', def:'exceptionally clever or talented' },
    { word:'Courageous', def:'brave; not afraid of danger' },
    { word:'Generous', def:'willing to give more than expected' },
    { word:'Humble', def:'not thinking too highly of yourself' },
    { word:'Inventive', def:'good at creating new things or ideas' },
    { word:'Joyful', def:'feeling or showing great happiness' },
    { word:'Keen', def:'having a sharp, eager mind' },
    { word:'Lively', def:'full of energy and enthusiasm' },
    { word:'Noble', def:'having fine, honorable qualities' },
    { word:'Optimistic', def:'hopeful and confident about the future' },
    { word:'Playful', def:'full of fun and good humor' }
  ];
  var wodWordEl = document.getElementById('wodWord');
  var wodDefEl = document.getElementById('wodDef');
  var lastWordDateKey = '';

  function dayOfYear(now){
    var start = new Date(now.getFullYear(), 0, 0);
    return Math.floor((now - start) / 86400000);
  }

  function updateWordOfDay(now){
    var dateKey = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
    if(dateKey === lastWordDateKey) return;
    lastWordDateKey = dateKey;
    var entry = WORD_LIST[dayOfYear(now) % WORD_LIST.length];
    wodWordEl.textContent = entry.word;
    wodDefEl.textContent = '— ' + entry.def;
  }

  // ---- fun fact of the day ----
  var FUN_FACTS = [
    'Honey never spoils — archaeologists have found 3,000-year-old honey that was still good to eat.',
    'Octopuses have three hearts and blue blood.',
    'A group of flamingos is called a "flamboyance."',
    'Bananas are botanically berries, but strawberries aren’t.',
    'Sharks have been around longer than trees — over 400 million years!',
    'A bolt of lightning is hotter than the surface of the sun.',
    'Sea otters hold hands while sleeping so they don’t float apart.',
    'A single cloud can weigh more than a million pounds.',
    'Butterflies taste with their feet.',
    'The Eiffel Tower can grow more than 6 inches taller in summer heat.',
    'A snail can sleep for three years straight.',
    'There are more stars in the sky than grains of sand on every beach on Earth.',
    'Elephants can’t jump — they’re the only mammal that can’t.',
    'Wombat poop is cube-shaped.',
    'A shrimp’s heart is located in its head.',
    'Hot water can freeze faster than cold water under the right conditions.',
    'A group of crows is called a "murder."',
    'Your nose can remember 50,000 different scents.',
    'It rains diamonds on Jupiter and Saturn.',
    'A crocodile cannot stick its tongue out.',
    'The shortest war in history lasted only 38 minutes.',
    'Some turtles can breathe through their butts.',
    'A jellyfish is 95% water.',
    'The dot over a lowercase "i" or "j" has a name: a tittle.',
    'Cows have best friends and get stressed when separated from them.',
    'A blue whale’s heart is about the size of a small car.',
    'Koalas have fingerprints so similar to humans they can confuse crime scenes.',
    'The inventor of the frisbee was turned into a frisbee after he died — his ashes were molded into discs.',
    'Tigers have striped skin, not just striped fur.',
    'A rainbow can only be seen in the morning or late afternoon.'
  ];
  var funFactEl = document.getElementById('funFactBody');
  var lastFactDateKey = '';

  function updateFunFact(now){
    var dateKey = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
    if(dateKey === lastFactDateKey) return;
    lastFactDateKey = dateKey;
    var fact = FUN_FACTS[dayOfYear(now) % FUN_FACTS.length];
    funFactEl.innerHTML = '<strong>Did you know?</strong> ' + fact;
  }

  // ---- countdown dial ----
  var countdownBand = document.getElementById('countdownBand');
  var countdownTime = document.getElementById('countdownTime');
  var dialWedge = document.getElementById('dialWedge');
  var trackCaption = document.getElementById('trackCaption');

  var DIAL_CX = 100, DIAL_CY = 100, DIAL_R = 84;

  (function drawTicks(){
    var ticksGroup = document.getElementById('dialTicks');
    for(var i = 0; i < 12; i++){
      var deg = i * 30;
      var rad = (deg - 90) * Math.PI / 180;
      var outerR = 92, innerR = i % 3 === 0 ? 78 : 84;
      var x1 = DIAL_CX + outerR * Math.cos(rad);
      var y1 = DIAL_CY + outerR * Math.sin(rad);
      var x2 = DIAL_CX + innerR * Math.cos(rad);
      var y2 = DIAL_CY + innerR * Math.sin(rad);
      var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('class', 'dial-tick');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      ticksGroup.appendChild(line);
    }
  })();

  function piePath(fraction){
    fraction = Math.max(0, Math.min(1, fraction));
    if(fraction <= 0.0015) return '';
    if(fraction >= 0.9985){
      return 'M ' + DIAL_CX + ' ' + (DIAL_CY - DIAL_R) +
        ' A ' + DIAL_R + ' ' + DIAL_R + ' 0 1 1 ' + (DIAL_CX - 0.01) + ' ' + (DIAL_CY - DIAL_R) + ' Z';
    }
    var angle = fraction * 360;
    function pt(deg){
      var rad = (deg - 90) * Math.PI / 180;
      return { x: DIAL_CX + DIAL_R * Math.cos(rad), y: DIAL_CY + DIAL_R * Math.sin(rad) };
    }
    var start = pt(0);
    var end = pt(angle);
    var largeArc = angle > 180 ? 1 : 0;
    return 'M ' + DIAL_CX + ' ' + DIAL_CY + ' L ' + start.x + ' ' + start.y +
      ' A ' + DIAL_R + ' ' + DIAL_R + ' 0 ' + largeArc + ' 1 ' + end.x + ' ' + end.y + ' Z';
  }

  var leaveTime = null;
  var totalMs = null;

  function defaultLeave(now){
    return new Date(now.getTime() + 25 * 60000);
  }

  function setLeaveTime(d, now, explicitTotalMs){
    leaveTime = d;
    totalMs = explicitTotalMs || Math.max(1, leaveTime.getTime() - now.getTime());
    leaveClockEl.innerHTML = formatClock(leaveTime);
  }

  setLeaveTime(defaultLeave(new Date()), new Date());

  function formatCountdown(ms){
    var totalSec = Math.max(0, Math.round(ms / 1000));
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    if(h > 0) return h + ':' + pad(m) + ':' + pad(s);
    return m + ':' + pad(s);
  }

  function tick(){
    var now = new Date();
    renderClock(now);
    updateWordOfDay(now);
    updateFunFact(now);
    var remaining = leaveTime.getTime() - now.getTime();
    if(remaining <= 0){
      countdownTime.textContent = "It's time!";
      dialWedge.setAttribute('d', '');
      countdownBand.className = 'countdown state-crit';
      trackCaption.textContent = 'time to go!';
    } else {
      countdownTime.textContent = formatCountdown(remaining);
      var fraction = remaining / totalMs;
      dialWedge.setAttribute('d', piePath(fraction));
      var mins = remaining / 60000;
      var state = mins <= 5 ? 'state-crit' : (mins <= 15 ? 'state-warn' : '');
      countdownBand.className = 'countdown ' + state;
      trackCaption.textContent = 'until the bus';
    }
    var counts = totalDoneCount();
    if(remaining <= 0 && counts.done < counts.total){
      banner.className = 'banner crit';
      banner.textContent = "Time to go — finish up on the way!";
    } else if(counts.total > 0 && counts.done === counts.total){
      banner.className = 'banner ready';
      banner.textContent = "Everyone's ready — nice work! ✨";
    }
  }

  updateProgress();
  tick();
  setInterval(tick, 1000);
})();
</script>

<!-- Google Cast Application Framework (receiver side) -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
(function(){
  var NAMESPACE = 'urn:x-cast:com.schoolapp.launchpad';
  var connPill = document.getElementById('connPill');
  var context = cast.framework.CastReceiverContext.getInstance();

  window.__launchpadSendToggle = function(kidId, taskId){
    try{
      context.getSenders().forEach(function(sender){
        context.sendCustomMessage(NAMESPACE, sender.id, { type:'TASK_TOGGLE', kidId: kidId, taskId: taskId });
      });
    }catch(e){}
  };

  context.addCustomMessageListener(NAMESPACE, function(event){
    var data = event.data;
    if(!data || !data.type) return;
    if(data.type === 'STATE_SYNC'){
      window.__launchpadApplyStateSync(data);
    } else if(data.type === 'TASK_TOGGLE'){
      window.__launchpadApplyToggle(data.kidId, data.taskId, false);
    }
  });

  context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, function(){
    connPill.textContent = 'Phone connected';
  });
  context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, function(){
    connPill.textContent = context.getSenders().length > 0 ? 'Phone connected' : 'Waiting for phone…';
  });

  var options = new cast.framework.CastReceiverOptions();
  options.disableIdleTimeout = true; // this is a dashboard, not a media player — never auto-close it
  context.start(options);
})();
</script>
